[project]
name = "cs-markdown-editor"
version = "0.1.0"
description = "Typora 式段级所见即所得 Markdown 编辑器，基于 Flet 0.86.2 声明式组件与 mistune 实时渲染"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CSTOS" }]
keywords = ["markdown", "editor", "flet", "wysiwyg", "typora"]

dependencies = [
    "flet>=0.86.2",
    "mistune>=3.3.4",
    "pillow>=12.3.0",
    "uharfbuzz>=0.40.0",
    "flet-code-editor>=0.86.2",
    "flet-datatable2>=0.86.2",
    "watchdog>=4.0.0",
]

[project.scripts]
cs-markdown-editor = "main:main_sync"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501", # 行长由格式化工具管
    # 中文项目：RUF001/002/003 对全角标点（，。：（）等）大量误报，关闭
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:flet.*"]


[tool.flet]
product = "CS-Markdown-Editor"
company = "ShawnChen"
org = "com.mycompany"
copyright = "Copyright © 2026 ShawnChen. All rights reserved."
build_number = 1


[tool.flet.app]
exclude = [
    "venv",
    ".git",
    ".flet",
    ".pytest_cache",
    ".trae",
    ".venv",
    "dist",
    "__pycache__",
    "*.pyc",
    "tests",
    "docs",
    "*.md",
    "*.log",
]

[tool.flet.compile]
app = true
packages = true
cleanup = true

[tool.flet.flutter]
build_args = [
    "--obfuscate",
    "--split-debug-info=./debug-symbols",
    "--tree-shake-icons",
]
